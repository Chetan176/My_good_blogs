<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | TechPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 dark:text-white">
    <main class="max-w-3xl mx-auto px-4 py-20">
        <h1 class="text-4xl font-black mb-4">Get in Touch</h1>
        <p class="text-gray-500 mb-12">Have a story tip or a question? We'd love to hear from you.</p>

        <form class="space-y-6 bg-white dark:bg-gray-800 p-8 rounded-3xl border dark:border-gray-700 shadow-xl">
            <div>
                <label class="block mb-2 font-bold">Full Name</label>
                <input type="text" class="w-full p-4 rounded-xl bg-gray-50 dark:bg-gray-900 border dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="John Doe">
            </div>
            <div>
                <label class="block mb-2 font-bold">Email Address</label>
                <input type="email" class="w-full p-4 rounded-xl bg-gray-50 dark:bg-gray-900 border dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="john@example.com">
            </div>
            <div>
                <label class="block mb-2 font-bold">Message</label>
                <textarea class="w-full p-4 rounded-xl bg-gray-50 dark:bg-gray-900 border dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none" rows="5" placeholder="Your message here..."></textarea>
            </div>
            <button class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">Send Message</button>
        </form>
    </main>
</body>
</html>
