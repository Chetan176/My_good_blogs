<body class="bg-white">
    <nav class="border-b border-gray-100 h-20 flex items-center">
        <div class="max-w-7xl mx-auto px-4 w-full flex justify-between items-center font-bold">
            <a href="index.html" class="text-2xl font-black">MY GOOD<span class="text-blue-600">BLOG</span></a>
            <a href="index.html" class="text-blue-600">Back Home</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-20 grid grid-cols-1 lg:grid-cols-2 gap-20">
        <div>
            <h1 class="text-5xl font-black mb-6">Contact <span class="text-blue-600">Us</span></h1>
            <p class="text-lg text-gray-500 mb-10">For questions, suggestions, feedback, or business inquiries, reach out to us using the form or email below.</p>
            
            <div class="space-y-6">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center"><i data-lucide="mail"></i></div>
                    <div>
                        <p class="text-sm text-gray-400">Email Address</p>
                        <p class="font-bold text-lg">chetanyadav7284@gmail.com</p>
                    </div>
                </div>
            </div>
        </div>

        <form class="bg-gray-50 p-10 rounded-3xl border border-gray-100 space-y-6">
            <div>
                <label class="block text-sm font-bold mb-2">Name</label>
                <input type="text" class="w-full px-6 py-4 rounded-xl border border-gray-200 focus:outline-none focus:ring-4 focus:ring-blue-500/10" placeholder="Your name">
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Email</label>
                <input type="email" class="w-full px-6 py-4 rounded-xl border border-gray-200 focus:outline-none focus:ring-4 focus:ring-blue-500/10" placeholder="your@email.com">
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Message</label>
                <textarea rows="5" class="w-full px-6 py-4 rounded-xl border border-gray-200 focus:outline-none focus:ring-4 focus:ring-blue-500/10" placeholder="How can we help?"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition shadow-xl shadow-blue-500/20">Send Message</button>
        </form>
    </main>
