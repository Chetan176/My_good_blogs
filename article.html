<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading... | My Good Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-white text-gray-900">

    <nav class="border-b border-gray-100 h-20 flex items-center">
        <div class="max-w-7xl mx-auto px-4 w-full flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black">MY GOOD<span class="text-blue-600">BLOG</span></a>
            <a href="index.html" class="text-sm font-bold text-gray-500 hover:text-blue-600">← BACK TO HOME</a>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-12">
        <div id="article-view">
            <!-- Injected by JS -->
        </div>

        <!-- AdSense In-Article -->
        <div class="my-12 py-8 border-y border-gray-100 flex items-center justify-center text-gray-300">
            <!-- ADSENSE CODE HERE -->
            Advertisement
        </div>

        <div class="mt-12">
            <h3 class="text-2xl font-black mb-8">Related Stories</h3>
            <div id="related-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Injected by JS -->
            </div>
        </div>
    </div>

    <script src="blog.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = parseInt(urlParams.get('id'));
            const response = await fetch('articles.json');
            const data = await response.json();
            const article = data.find(a => a.id === id);

            if (article) {
                document.title = `${article.title} | My Good Blog`;
                document.getElementById('article-view').innerHTML = `
                    <div class="mb-6">
                        <span class="text-blue-600 font-bold uppercase tracking-widest text-sm">${article.category}</span>
                    </div>
                    <h1 class="text-4xl md:text-6xl font-black leading-tight mb-8">${article.title}</h1>
                    <div class="flex items-center gap-4 mb-10 pb-10 border-b border-gray-100">
                        <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-400">${article.author[0]}</div>
                        <div>
                            <div class="font-bold">${article.author}</div>
                            <div class="text-sm text-gray-400">${article.date} · ${article.readTime} read</div>
                        </div>
                    </div>
                    <img src="${article.image}" class="w-full h-[500px] object-cover rounded-3xl mb-12 shadow-2xl shadow-blue-100/50">
                    <div class="prose prose-lg max-w-none text-gray-700 leading-relaxed">
                        <p class="text-xl mb-6 font-medium text-gray-900">${article.excerpt}</p>
                        <p>${article.content}</p>
                        <p class="mt-4">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
                    </div>
                `;

                // Render related
                const related = data.filter(a => a.category === article.category && a.id !== id).slice(0, 2);
                document.getElementById('related-grid').innerHTML = related.map(rel => `
                    <a href="article.html?id=${rel.id}" class="group">
                        <img src="${rel.image}" class="w-full h-48 object-cover rounded-2xl mb-4 grayscale group-hover:grayscale-0 transition duration-500">
                        <h4 class="font-bold text-xl group-hover:text-blue-600 transition">${rel.title}</h4>
                    </a>
                `).join('');
            }
            lucide.createIcons();
        });
    </script>
</body>
</html>
